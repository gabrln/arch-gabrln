# Umbriel config

[include]
files = ["noctalia.toml"]

[general]
autostart = ["noctalia"]
mod_key = "Super"
xwayland = true
show_cheatsheet = false
focus_on_activate = true
honor_restored_maximize = false

[environment]
QT_QPA_PLATFORMTHEME = "qt6ct"
PROTON_ENABLE_WAYLAND = "1"

[workspaces]
back_and_forth = false
empty_above = false

[colors]

[animation]
enabled = false

# Appearance ---------------------------------------------------------------

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 10
drag_opacity = 0.75

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 10
offset_x = 2
offset_y = 2
color = "#0000007F"

# Overview -------------------------------------------------------------------

[overview]
zoom = 0.5

# Hot corners ---------------------------------------------------------------

[hot_corners.top_left]
enabled = true
delay_ms = 500
action = "overview-open"

[hot_corners.top_right]
enabled = false
delay_ms = 500
action = "overview-close"

[hot_corners.bottom_left]
enabled = false
delay_ms = 500
action = "overview-toggle"

[hot_corners.bottom_right]
enabled = false
delay_ms = 500
action = "spawn:notify-send 'Bottom right'"

# Layout ---------------------------------------------------------------------

[layout]
mode = "scrolling"
gap = 8
width_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_width_fraction = 0.5
center_underfull_strip = true
center_focused = false
expand_single_column = true

[layout.dwindle]

[layout.master]
position = "left"
default_width_fraction = 0.55
new_on_top = true

# Outputs (see docs/user/outputs.md) ----------------------------------------

[output."HDMI-A-1"]
mode = "1920x1080@120"
position = [1920, 0]
scale = 1.0
tearing = true
vrr = "fullscreen"
workspaces = 10

[output."eDP-1"]
mode = "1920x1080@60"
position = [0, 0]
scale = 1.0
tearing = true
vrr = "fullscreen"
workspaces = 10

# Input ----------------------------------------------------------------------

[input]
middle_click_paste = true

[input.keyboard]
layout = "br"
variant = ""
options = ""
repeat_rate = 25
repeat_delay = 600
numlock_toggle = true

[input.touchpad]
tap = true

[input.mouse]
accel_profile = "flat"
sensitivity = -0.4
scroll_wheel_step = 60

[input.tablet]
enabled = true

[input.cursor]
theme = "capitaine-cursors"
size = 24
hardware_cursor = true
follows_focus = true
hide_when_typing = false
hide_timeout_ms = 600

[input.focus]
follows_mouse = true

# Keybinds --------------------------------------------------------------

[keybinds]
"Mod+Return" = "spawn:kitty"
"Mod+B" = "spawn:firefox"
"Mod+T" = "window-toggle-floating"
"Mod+Shift+T" = "window-focus-switch-floating"
"Mod+M" = "window-toggle-maximize-to-edges"
"Mod+F" = "window-toggle-fullscreen"
"Mod+Slash" = "cheatsheet-toggle"
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Mod+P" = "spawn:noctalia msg screenshot-region"
"Mod+Shift+P" = "spawn:noctalia msg screenshot-fullscreen"
"Mod+Q" = "window-close"
"Mod+Shift+Space" = "window-move-to-scratchpad"
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = "window-restore-from-scratchpad"
"Mod+Tab" = "scratchpad-focus-next"
"Mod+O" = "overview-toggle"
"Mod+D" = "spawn:noctalia msg panel-toggle launcher"
"Mod+W" = "spawn:noctalia msg panel-toggle wallpaper"
"Mod+N" = "spawn:noctalia msg panel-toggle noctalia/notes:panel"
"Mod+Escape" = "spawn:noctalia msg panel-toggle session"
"Mod+R" = "window-cycle-width"

"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+0" = "workspace-switch:10"

"Mod+H" = "window-focus-left"
"Mod+L" = "window-focus-right"
"Mod+Shift+H" = "window-move-to-workspace-previous"
"Mod+Shift+L" = "window-move-to-workspace-next"

"Mod+K" = "output-focus-right"
"Mod+J" = "output-focus-left"
"Mod+Ctrl+K" = "window-move-to-output-right"
"Mod+Ctrl+J" = "window-move-to-output-left"

"XF86AudioRaiseVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"Mod+XF86AudioMute" = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86AudioPlay" = "spawn:playerctl play-pause"
"XF86AudioNext" = "spawn:playerctl next"
"XF86AudioPrev" = "spawn:playerctl previous"
"XF86MonBrightnessUp" = "spawn:brightnessctl set +5%"
"XF86MonBrightnessDown" = "spawn:brightnessctl set 5%-"

# Window and layer rules -----------------------------------------------------

[[window_rule]]
match.xdg_tag = "^proton-game$"
default_fullscreen = true

[[window_rule]]
match.content_type = "game"
vrr = "always"

[[window_rule]]
match.app_id = "^(steam_app_[0-9]+|gamescope)$"
tearing = true

[[window_rule]]
blur = true
blur_optimized = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_size = [1020, 900]

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_size = [800, 600]

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false
